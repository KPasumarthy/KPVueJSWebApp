<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <scrIPT src="https://unpkg.com/vue@3/dist/vue.global.js"></scrIPT>
    <title>KP : Vue-Vite App</title>
  </head>
  <body>
    <div id="app">
        <h1>{{ msg }}</h1>
        <button @click="clickHandler">Click Me!</button>
    </div>
    <script>  
      const app = Vue.createApp ({
      
      data() {
          return {
            msg: 'Hello Vue 3 + Vite!'
          }
        },
      methods: {
          clickHandler() {
            alert('KP : Button Clicked!');
            console.log('KP : Button Clicked!');
            this.msg = 'KP : Button Clicked!';
          }
        }
      });

      app.mount('#app')

    </script>
  </body>
</html>
